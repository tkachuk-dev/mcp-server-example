# Local run of the MCP server next to users-service and billing-service.
# Prerequisite (once): docker network create internal-ai
# Values: docker/local.env (committed placeholders), overridden by .env.local (git-ignored).
services:
  mcp-server:
    build: .
    image: internal-ai/mcp-server:local
    ports:
      - "8080:80"
    # Later files win: committed defaults first, then personal git-ignored overrides.
    # (An `environment:` block would override both, so values live only in these files.)
    env_file:
      - path: docker/local.env
      - path: .env.local
        required: false
    networks:
      internal-ai:
        aliases: [mcp-server]
    restart: unless-stopped

networks:
  internal-ai:
    external: true
