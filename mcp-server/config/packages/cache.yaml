framework:
    cache:
        prefix_seed: internal-ai/mcp-server
        # cache.app holds MCP sessions, rate-limiter state and the Google token cache.
        # Filesystem is fine for a single replica. For several replicas switch to a shared Redis:
        #   app: cache.adapter.redis
        #   default_redis_provider: '%env(REDIS_URL)%'
        app: cache.adapter.filesystem
