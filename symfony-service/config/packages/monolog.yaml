monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - ai_audit

when@dev:
    monolog:
        handlers:
            ai_audit:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
                channels: [ai_audit]
            main:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
                channels: ["!event", "!ai_audit", "!deprecation", "!doctrine"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!ai_audit"]

when@test:
    monolog:
        handlers:
            ai_audit:
                type: test
                level: info
                channels: [ai_audit]
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!ai_audit"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            ai_audit:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
                channels: [ai_audit]
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!ai_audit"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!ai_audit"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
