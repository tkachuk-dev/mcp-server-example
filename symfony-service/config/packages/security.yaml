security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        # The internal_ai firewall builds its user from the token handler's UserBadge loader;
        # this provider is never used to load real users.
        mcp_service_nobody:
            memory: null

    # ROLE_AI_READ is intentionally absent: it must neither inherit nor grant any user role.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_MANAGER]
        ROLE_MANAGER: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        health:
            pattern: ^/health/
            security: false
        # Must stay above "main": service tokens are accepted only here.
        internal_ai:
            pattern: ^/internal/ai
            stateless: true
            provider: mcp_service_nobody
            access_token:
                token_handler: App\Security\Internal\McpServiceTokenHandler
                failure_handler: App\Security\Internal\InternalAiAuthenticationHandler
            entry_point: App\Security\Internal\InternalAiAuthenticationHandler
        main:
            lazy: true
            provider: app_user_provider
            json_login:
                check_path: api_auth_login

    access_control:
        - { path: ^/internal/ai, methods: [GET, HEAD], roles: ROLE_AI_READ }
        # Any other method on /internal/ai is denied even if a route is added later.
        - { path: ^/internal/ai, roles: ROLE_NO_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
